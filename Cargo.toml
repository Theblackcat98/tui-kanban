[package]
name = "tui-kanban"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A beautiful terminal Kanban board"
license = "MIT"
repository = "https://github.com/Theblackcat98/tui-kanban"
readme = "README.md"
keywords = ["kanban", "tui", "terminal", "todo"]
categories = ["command-line-utilities"]
# The demo and screenshots are for the README on GitHub.
exclude = ["docs/demo.gif", "docs/screenshots/"]

[dependencies]
anyhow = "1.0"
atomic-write-file = "0.3.1"
catppuccin = { version = "2.8.0", features = ["ratatui"] }
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30.2"
nucleo-matcher = "0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
terminal-colorsaurus = "1.0"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
tui-textarea = { package = "tui-textarea-2", version = "0.13.2" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
uuid = { version = "1.24", features = ["serde", "v4"] }
notify = "8.2"

[dev-dependencies]
insta = "1.48"
tempfile = "3.27"
