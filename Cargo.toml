[package]
name = "tui-kanban"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A beautiful terminal Kanban board"
license = "MIT"

[dependencies]
anyhow = "1.0"
atomic-write-file = "0.3.1"
catppuccin = { version = "2.8.0", features = ["ratatui"] }
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["serde", "v4"] }

[dev-dependencies]
insta = "1.48"
tempfile = "3.27"
